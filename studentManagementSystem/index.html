<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <!-- css file  -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <h1>Student Management System</h1>
    </header>
    <main>
        <!--======= form======= -->
        <div class="forms">
            <form>
                <div class="form-group">
                    <label>student ID: </label>
                    <input type="number" id="idInput" placeholder="student id.." required>
                </div>
                <div class="form-group">
                    <label>student Name:</label>
                    <input type="text" id="nameInput" placeholder="student name.." required>

                </div>
                <div class="form-group">
                    <label>student Class: </label>
                    <input type="text" id="classInput" placeholder="student Class.." required>
                </div>
                <div class="form-group">
                    <label>student Age: </label>
                    <input type="number" id="ageInput" placeholder="student Age.." required>
                </div>
                <div class="form-group">
                    <label>student City: </label>
                    <input type="text" id="cityInput" placeholder="student City.." required>
                </div>
                <div class="form-group">
                    <label>student Grade: </label>
                    <input type="number" id="gradeInput" placeholder="student Grade.." required>
                </div>
                <div class="form-group">
                    <label>student Phone: </label>
                    <input type="tel" id="phoneInput" placeholder="student Phone.." required>
                </div>
                <button type="submit" id="addBtn">Add Students</button>

            </form>
        </div>
        <!-- students lists -->
        <div class="students-table">
            <h2>Students Information</h2>
            <table>
                <thead>
                     <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Age</th>
                    <th>City</th>
                    <th>Grade</th>
                    <th>Phone</th>

                </tr>
                </thead>
               <!-- students lists -->
                <tbody class="students-lists">
                    <tr>
                       

                    </tr>
                    

                    
                </tbody>
               
            </table>
        </div>
    </main>

    <!-- js file -->
    <script src="./main.js"></script>
</body>

</html>
