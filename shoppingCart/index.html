<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart JS-Project</title>
    <!-- FONTAWOSOME  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- CSS FILE -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- ===HEADER=== -->
    <header>
        <!-- LOGO  -->
        <div class="logo">
            <h1>NICE <span>SHOES</span>.</h1>
        </div>
        <!-- CART ICON -->
        <div class="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count" id="cart-count">0</span>
        </div>

    </header>

    <main class="main">
        <h1>Featured Shoes</h1>
        <!-- PRODUCTS SECTION -->
        <section class="products-section" id="products-section">
            <!-- product one -->
            <div class="item-one">
                <!-- item image -->
                <img src="images/nice1.jpg" alt="NIKE-1">
                <div class="item-content">
                    <h3 class="name">NIKE-1</h3>
                    <!-- quantity-control -->
                    <div class="quantity-control">
                        <button class="quantity-decrease">&minus;</button>
                        <h4 class="quantity">1</h4>
                        <button class="quantity-increase">&plus;</button>
                    </div>
                </div>
                <div class="price">
                    <h2 id="price">$12</h2>
                </div>
                <!-- add cart btn -->
                <div class="cart-btn">
                    <button class="add-cart-btn">Add to cart</button>
                </div>
            </div>




        </section>


        <!-- CART SECTION -->
        <section class="cart-section">
            <h1>Your cart itmes</h1>
            <!-- item one -->

            <div class="cart-item">
                <!-- item image -->
                <img src="images/nice1.jpg" alt="NIKE-1">

                <h3 class="name">NIKE-1</h3>
                <!-- price -->
                <div class="price">
                    <h2 id="price">$12</h2>
                </div>
                <!-- quantity-control -->
                <div class="quantity-control">
                    <button class="quantity-decrease">&minus;</button>
                    <h4 class="quantity">1</h4>
                    <button class="quantity-increase">&plus;</button>
                </div>
                <!-- remove btn -->
                <div class="remove-button">
                    <button id="remove-btn">&times;</button>
                </div>
            </div>
              <!-- cart footer -->
                <div class="total-price">
                    <h3 class="total">Total:0</h3>
                </div>
        </section>

    </main>

    <!-- JS FILE -->
    <script src="./script.js"></script>
</body>

</html>
