<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day-6</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        outline: none;
        border: none;
        font-family: sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        flex-direction: column;
        gap: 1rem;
        background-color: #333;
      }
      .container {
        background-color: #fff;
        max-width: 400px;
        width: 100%;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        border-radius: 10px;
      }
      .container h2 {
        font-size: 1.5rem;
        font-weight: 600;
        text-transform: uppercase;
        color: #161686;
        width: 100%;
      }
      #character-count{
        border: 1.5px solid #333;
        padding: 0.5rem 1.5rem;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>character count</h2>
      <input type="text" id="character-count" placeholder="write your text here..">
      <p id="count">Character cout: <span>0</span> </p>
    </div>

    <!-- js -->
    <script src="./script.js"></script>
  </body>
</html>
